name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v4
        with:
          # fetch full history in case tools need tags or history
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Environment debug
        run: |
          echo "== System information =="
          uname -a || true
          node -v || true
          npm -v || true
          echo "== Repo listing =="
          ls -la || true

      - name: Install dependencies (with retry)
        run: |
          set -e
          n=0
          until [ "$n" -ge 3 ]
          do
            npm ci && break
            n=$((n+1))
            echo "npm ci failed, retrying ($n/3)..."
            sleep 5
          done

      - name: Run lint (non-blocking temporarily)
        run: npm run lint --silent || true

      - name: Run tests
        run: npm test --silent
