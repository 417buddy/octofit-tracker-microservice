name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v4
        with:
          # fetch full history in case tools need tags or history
          fetch-depth: 0

      - name: Debug runner info
        run: |
          echo "Runner: $(hostname)"
          echo "== System information =="
          uname -a || true
          echo "== Node/npm =="
          node -v || true
          npm -v || true
          echo "== Repo listing =="
          ls -la || true
          cat /etc/os-release || true

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (with retries)
        run: |
          set -e
          for i in 1 2 3; do
            echo "Attempt $i: npm ci"
            if npm ci --silent; then
              break
            fi
            sleep $((i * 5))
            if [ $i -eq 3 ]; then
              echo "npm ci failed after 3 attempts"
              exit 1
            fi
          done

      - name: Upload npm install log (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-ci-log
          path: |
            npm-ci.log
            npm-debug.log

      - name: Run lint (non-blocking)
        run: |
          npm run lint || echo "Lint failed but continuing (temporary guard)"

      - name: Run tests
        run: npm test --silent
